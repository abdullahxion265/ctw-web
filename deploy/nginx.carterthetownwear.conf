# Nginx alternative. The supplier setup uses Apache, so prefer apache.*.conf.
# Install:
#   sudo cp deploy/nginx.carterthetownwear.conf /etc/nginx/sites-available/carterthetownwear
#   sudo ln -s /etc/nginx/sites-available/carterthetownwear /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d carterthetownwear.com -d www.carterthetownwear.com
server {
    listen 80;
    server_name carterthetownwear.com www.carterthetownwear.com;

    root /var/www/carterthetownwear;   # populated by deploy/update.sh
    index index.html;
    client_max_body_size 10M;   # app accepts 8MB image uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        expires 30d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router fallback: /browse and /admin must serve index.html
    location / {
        try_files $uri /index.html;
    }
}

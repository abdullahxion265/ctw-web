# HTTPS vhost. Use this ONLY if a certificate for the domain already exists
# (check: sudo ls /etc/letsencrypt/live/). Adjust the cert paths if the
# supplier put them elsewhere.
#
#   sudo a2enmod proxy proxy_http headers ssl
<VirtualHost *:80>
    ServerName carterthetownwear.com
    ServerAlias www.carterthetownwear.com
    Redirect permanent / https://www.carterthetownwear.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.carterthetownwear.com
    ServerAlias carterthetownwear.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/carterthetownwear.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/carterthetownwear.com/privkey.pem

    DocumentRoot /var/www/carterthetownwear

    <Directory /var/www/carterthetownwear>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/     http://127.0.0.1:5000/api/
    ProxyPassReverse /api/     http://127.0.0.1:5000/api/
    ProxyPass        /uploads/ http://127.0.0.1:5000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:5000/uploads/

    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/carterthetownwear-error.log
    CustomLog ${APACHE_LOG_DIR}/carterthetownwear-access.log combined
</VirtualHost>

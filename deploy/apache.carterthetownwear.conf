# HTTP-only vhost. Use this BEFORE SSL exists, then run certbot.
#
#   sudo a2enmod proxy proxy_http headers
#   sudo cp deploy/apache.carterthetownwear.conf /etc/apache2/sites-available/carterthetownwear.conf
#   sudo a2ensite carterthetownwear.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d carterthetownwear.com -d www.carterthetownwear.com
#
# If the supplier already created a vhost for this domain, edit that file
# instead and copy in the DocumentRoot, FallbackResource and Proxy lines.
<VirtualHost *:80>
    ServerName carterthetownwear.com
    ServerAlias www.carterthetownwear.com

    # Static React build, copied here by deploy/update.sh
    DocumentRoot /var/www/carterthetownwear

    <Directory /var/www/carterthetownwear>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # React Router: unknown paths (/browse, /admin) serve index.html
        FallbackResource /index.html
    </Directory>

    # API + uploaded product images go to Node (PM2) on port 5000
    ProxyPreserveHost On
    ProxyPass        /api/     http://127.0.0.1:5000/api/
    ProxyPassReverse /api/     http://127.0.0.1:5000/api/
    ProxyPass        /uploads/ http://127.0.0.1:5000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:5000/uploads/

    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/carterthetownwear-error.log
    CustomLog ${APACHE_LOG_DIR}/carterthetownwear-access.log combined
</VirtualHost>
